[package]
name = "coinselect-bench-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned by scripts in ../bench.py; see ../pins.json. Kept in sync by `bench.py setup`.
bdk_coin_select = { git = "https://github.com/bitcoindevkit/coin-select.git", rev = "fb5a0219d3ad1d34e48cae6678dbec66595c8a7e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The pinned revision takes `&SelectionView` in `BnbMetric`, so this is on by default. Revisions
# from before coin-select PR #53 take `&CoinSelector` instead; build those with
# `--no-default-features`. `bench.py compare-revs` picks the right shape by trying both.
default = ["selection-view", "lowest-fee-changeless"]
selection-view = []
# Later revisions replace the `Changeless<M>` wrapper with a dedicated `LowestFeeChangeless`
# metric carrying a changeless-specific bound. Same objective, different type.
lowest-fee-changeless = []

[profile.release]
debug = true
lto = false
codegen-units = 1

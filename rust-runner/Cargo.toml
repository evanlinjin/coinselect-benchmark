[package]
name = "coinselect-bench-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned by scripts in ../bench.py; see ../pins.json. Kept in sync by `bench.py setup`.
bdk_coin_select = { git = "https://github.com/evanlinjin/coin-select.git", rev = "bdcb1f064cd20ab4d864e6f040f0d45a6fd5e8fc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The pinned revision takes `&SelectionView` in `BnbMetric`, so this is on by default. Revisions
# from before coin-select PR #53 take `&CoinSelector` instead; build those with
# `--no-default-features`. `bench.py compare-revs` picks the right shape by trying both.
default = ["selection-view"]
selection-view = []

[profile.release]
debug = true
lto = false
codegen-units = 1

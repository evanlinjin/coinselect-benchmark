[package]
name = "coinselect-bench-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned by scripts in ../bench.py; see ../pins.json. Kept in sync by `bench.py setup`.
bdk_coin_select = { git = "https://github.com/evanlinjin/coin-select.git", rev = "ecdbbc93cf8e029f3716f4f8b0b6c42aa965dcd0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
lto = false
codegen-units = 1

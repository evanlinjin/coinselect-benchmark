[package]
name = "coinselect-bench-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned by scripts in ../bench.py; see ../pins.json. Kept in sync by `bench.py setup`.
bdk_coin_select = { git = "https://github.com/evanlinjin/coin-select.git", rev = "5dded08f92376e4f4d808c102763459682130e14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
lto = false
codegen-units = 1
